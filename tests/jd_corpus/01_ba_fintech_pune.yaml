id: ba_fintech_pune
domain: business analysis
jd: |
  Job Title: Senior Business Analyst - Payments

  About the team
  Our BA team sits between product, engineering and our banking partners.

  Responsibilities:
  - Run requirement elicitation workshops with stakeholders and write BRDs and FRDs
  - Convert business needs into user stories and acceptance criteria in Jira
  - Support UAT and track defects with the QA team and the Scrum Master
  - Build process maps (BPMN) and gap analysis for new payment flows

  Requirements:
  - 5+ years of experience as a Business Analyst in fintech or banking
  - Strong requirements gathering and documentation skills
  - Advanced MS Excel and SQL for data validation
  - Working knowledge of Agile / Scrum
  - Bachelor's degree in Engineering or equivalent experience
  - CBAP certification preferred

  Location: Pune, India (Hybrid - 3 days in office)
  CTC: 18-24 LPA
