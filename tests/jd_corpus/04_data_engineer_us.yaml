jd: |
  Data Engineer

  Remote (United States)

  You'll build the batch and streaming pipelines behind our analytics platform.

  Responsibilities
  - Build and maintain ELT pipelines with Airflow and dbt on Snowflake
  - Develop streaming ingestion with Kafka and Spark
  - Own data quality checks and pipeline monitoring

  Qualifications
  - 3+ years of data engineering experience
  - Strong Python and SQL
  - Hands-on with AWS (S3, Redshift or similar)
  - Bachelor's degree in Computer Science or a related field required; Master's degree preferred

  Compensation: $130,000 - $160,000 base.
  Candidates must be authorized to work in the US. We do not sponsor visas for this role.
