id: h_logistics_coordinator_jeddah
domain: logistics
jd: |
  Logistics Coordinator
  Jeddah, KSA

  Job Responsibilities
  • Coordinate inbound and outbound shipments with freight forwarders
  • Track customs clearance documentation and delivery schedules
  • Maintain inventory records in SAP and prepare weekly logistics reports

  Job Requirements
  • Bachelor's degree in Supply Chain, Logistics or Business
  • 2+ years of logistics experience in the GCC
  • Good command of Excel and SAP
  • Valid Saudi driving license preferred

  Transferable Iqama required. This is a full-time office-based role.
